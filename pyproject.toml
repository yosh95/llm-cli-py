[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cli-py"
version = "0.2.0"
description = "Unified OpenAI-Compatible CLI for AI Agents (Python Edition)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "yosh95"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "requests>=2.31",
    "prompt_toolkit>=3.0",
    "tomli-w>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
llm-cli-py = "llm_cli_py.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "EM", "PERF", "PIE", "PTH", "RET", "RUF", "TRY"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# "." lets the tests import shared helpers from tests/conftest.py as a module
# path ("tests.conftest") regardless of the working directory.
pythonpath = [".", "src"]
testpaths = ["tests"]
