# Dependabot: GitHub Actions と Python 依存の更新PRを週次で作成する
version: 2
updates:
  # GitHub Actions(actions/checkout, actions/setup-python など)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Python 依存(pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
